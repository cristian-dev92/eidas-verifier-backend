spring.application.name=eudi-verifier

# Perfil activo (dev | prod). Sin perfil => el bypass de desarrollo queda desactivado.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# Base de datos (Neon en producción se configura por variables de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eudi_verifier_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Puerto (Render inyecta PORT automáticamente)
server.port=${PORT:8080}

# CORS: lista separada por comas de orígenes permitidos
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Actuator: exponer únicamente health para el health check de Render
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
