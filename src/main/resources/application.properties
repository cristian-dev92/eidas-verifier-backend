spring.application.name=eudi-verifier

# Perfil por defecto en local (dev). En Render se define SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# Base de datos (Neon en producción se configura por variables de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eudi_verifier_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Puerto (Render inyecta PORT automáticamente)
server.port=${PORT:8080}

# CORS: lista separada por comas de orígenes permitidos
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Identidad del verificador y alcance solicitado
app.verifier.client-id=${APP_VERIFIER_CLIENT_ID:https://eudi-verifier.com}
app.verifier.scope=${APP_VERIFIER_SCOPE:age_over_15}
app.verifier.nonce-ttl-seconds=${APP_VERIFIER_NONCE_TTL_SECONDS:180}
# Bypass de tokens mock: SOLO se activa en application-dev.properties (ignorado por git).
app.verifier.allow-dev-mock=${APP_VERIFIER_ALLOW_DEV_MOCK:false}

# Emisor propio de credenciales de edad (issuer)
app.issuer.id=${APP_ISSUER_ID:https://issuer.eudi-demo.local}
app.issuer.credential-ttl-seconds=${APP_ISSUER_CREDENTIAL_TTL_SECONDS:600}

# Actuator: exponer únicamente health para el health check de Render
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
